name: Meta Manual Publisher
on:
  workflow_dispatch:
    inputs:
      action:
        description: publish or delete
        required: true
        type: choice
        options: [publish, delete]
      page:
        description: Facebook Page exact name
        required: true
        type: string
      message:
        description: Post text for publish
        required: false
        type: string
      link:
        description: Link for publish
        required: false
        type: string
      post_id:
        description: Post ID for delete
        required: false
        type: string
jobs:
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_VERSION: v26.0
    steps:
      - uses: actions/checkout@v4
      - name: Publish link post
        if: ${{ inputs.action == 'publish' }}
        run: python3 tools/meta_social.py publish --page "$PAGE" --message "$MESSAGE" --link "$LINK"
        env:
          PAGE: ${{ inputs.page }}
          MESSAGE: ${{ inputs.message }}
          LINK: ${{ inputs.link }}
      - name: Delete post
        if: ${{ inputs.action == 'delete' }}
        run: python3 tools/meta_social.py delete --page "$PAGE" --post-id "$POST_ID"
        env:
          PAGE: ${{ inputs.page }}
          POST_ID: ${{ inputs.post_id }}
